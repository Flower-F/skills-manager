<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Skills Manager in three steps</title>
  <desc id="desc">Choose a Skill, say which change to keep, then update normally while Skills Manager preserves that change.</desc>

  <rect width="1200" height="430" rx="28" fill="#F7F4ED"/>
  <text x="64" y="64" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="760">Three simple steps</text>
  <text x="64" y="101" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21">No patch files to replay. Just tell Skills Manager what result should stay.</text>

  <g id="step-one" transform="translate(64 142)">
    <rect width="316" height="190" rx="20" fill="#FFFFFF" stroke="#D8D3C7" stroke-width="2"/>
    <circle cx="46" cy="46" r="24" fill="#0B1220"/>
    <text x="46" y="55" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">1</text>
    <text x="28" y="102" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="750">Choose a Skill</text>
    <text x="28" y="140" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Discover one or bring</text>
    <text x="28" y="169" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">a source you already trust.</text>
  </g>

  <g transform="translate(394 223)">
    <path d="M0 0h42" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M33-9l10 9-10 9" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="step-two" transform="translate(450 142)">
    <rect width="316" height="190" rx="20" fill="#FFFFFF" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="46" cy="46" r="24" fill="#12312F"/>
    <text x="46" y="55" text-anchor="middle" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">2</text>
    <text x="28" y="102" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="750">Say what to keep</text>
    <text x="28" y="140" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Approve one clear change.</text>
    <text x="28" y="169" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">That change is a Patch.</text>
  </g>

  <g transform="translate(780 223)">
    <path d="M0 0h42" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <path d="M33-9l10 9-10 9" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="step-three" transform="translate(836 142)">
    <rect width="300" height="190" rx="20" fill="#12312F"/>
    <circle cx="46" cy="46" r="24" fill="#2DD4BF"/>
    <path d="M35 46l7 7 14-18" fill="none" stroke="#062925" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="102" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="750">Update normally</text>
    <text x="28" y="140" fill="#CCFBF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">The Skill moves forward.</text>
    <text x="28" y="169" fill="#5EEAD4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Your change stays.</text>
  </g>

  <g transform="translate(64 360)">
    <rect width="1072" height="42" rx="21" fill="#E1F7F3"/>
    <text x="536" y="28" text-anchor="middle" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">Patch = one approved change you want Skills Manager to keep</text>
  </g>
</svg>
