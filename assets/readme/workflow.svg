<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">How Skills Manager works</title>
  <desc id="desc">A four-step workflow: choose through npx skills, approve an Intent, save the Intent before customizing, then update upstream and semantically reapply and review the Intent.</desc>

  <rect width="1200" height="470" rx="28" fill="#F7F4ED"/>
  <text x="64" y="66" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="750">A semantic layer, not another package manager</text>
  <text x="64" y="101" fill="#526071" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">npx skills owns packages · Skills Manager owns the approved outcome</text>

  <path d="M190 216H1010" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <path d="M316 216H1010" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(70 158)">
    <circle cx="58" cy="58" r="58" fill="#0B1220"/>
    <text x="58" y="68" text-anchor="middle" fill="#F7F4ED" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">01</text>
    <text x="58" y="158" text-anchor="middle" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Choose</text>
    <text x="58" y="188" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Discover or select</text>
    <text x="58" y="214" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">with npx skills</text>
  </g>

  <g transform="translate(338 158)">
    <circle cx="58" cy="58" r="58" fill="#12312F" stroke="#2DD4BF" stroke-width="3"/>
    <text x="58" y="68" text-anchor="middle" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">02</text>
    <text x="58" y="158" text-anchor="middle" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Approve</text>
    <text x="58" y="188" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">State the semantic</text>
    <text x="58" y="214" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">outcome you want</text>
  </g>

  <g transform="translate(606 158)">
    <circle cx="58" cy="58" r="58" fill="#12312F" stroke="#2DD4BF" stroke-width="3"/>
    <text x="58" y="68" text-anchor="middle" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">03</text>
    <text x="58" y="158" text-anchor="middle" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Record</text>
    <text x="58" y="188" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Save the Intent</text>
    <text x="58" y="214" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">before editing</text>
  </g>

  <g transform="translate(874 158)">
    <circle cx="58" cy="58" r="58" fill="#12312F" stroke="#F59E0B" stroke-width="3"/>
    <text x="58" y="68" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">04</text>
    <text x="58" y="158" text-anchor="middle" fill="#0B1220" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700">Update</text>
    <text x="58" y="188" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Reapply semantically</text>
    <text x="58" y="214" text-anchor="middle" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">and review</text>
  </g>

  <g transform="translate(1024 190)">
    <path d="M0 26h78" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M68 16l10 10-10 10" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="39" y="63" text-anchor="middle" fill="#9A6700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">REVIEW</text>
  </g>

  <rect x="64" y="420" width="1072" height="2" fill="#D8D3C7"/>
  <text x="64" y="450" fill="#526071" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Intent = desired behavior · not a textual patch to replay</text>
</svg>
