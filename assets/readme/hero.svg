<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Skills Manager</title>
  <desc id="desc">Skills Manager preserves a user-approved semantic Intent while an installed Agent Skill moves from one upstream version to the next.</desc>

  <rect width="1200" height="440" rx="28" fill="#0B1220"/>

  <g transform="translate(64 54)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="2">AGENT SKILL WORKFLOW · PUBLIC PREVIEW</text>
    <text x="0" y="76" fill="#F7F4ED" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="750">Skills Manager</text>
    <text x="0" y="130" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26">Keep the behavior you chose—</text>
    <text x="0" y="166" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26">even when the Skill changes upstream.</text>

    <g transform="translate(0 226)">
      <rect width="244" height="50" rx="12" fill="#132136" stroke="#2DD4BF" stroke-width="2"/>
      <circle cx="25" cy="25" r="6" fill="#2DD4BF"/>
      <text x="43" y="32" fill="#E6FFFB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="650">semantic Intents</text>
    </g>
    <text x="0" y="316" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">built on the public npx skills interface</text>
  </g>

  <g transform="translate(676 54)">
    <text x="0" y="0" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600" letter-spacing="1.5">ONE INTENT · TWO UPSTREAM STATES</text>

    <g transform="translate(0 34)">
      <rect width="460" height="92" rx="16" fill="#111C2E" stroke="#334155" stroke-width="2"/>
      <text x="24" y="31" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">UPSTREAM · V1</text>
      <text x="24" y="66" fill="#F7F4ED" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650">Installed Skill</text>
      <path d="M378 32h52M378 46h38M378 60h46" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    </g>

    <path d="M230 126V158" stroke="#64748B" stroke-width="2" stroke-dasharray="5 7"/>

    <g transform="translate(0 158)">
      <rect width="460" height="82" rx="16" fill="#12312F" stroke="#2DD4BF" stroke-width="2"/>
      <circle cx="27" cy="41" r="8" fill="#2DD4BF"/>
      <text x="50" y="33" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">USER-APPROVED INTENT</text>
      <text x="50" y="60" fill="#E6FFFB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">The semantic outcome to preserve</text>
    </g>

    <path d="M230 240V272" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M220 264l10 10 10-10" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 272)">
      <rect width="460" height="92" rx="16" fill="#111C2E" stroke="#F59E0B" stroke-width="2"/>
      <text x="24" y="31" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">UPSTREAM · V2</text>
      <text x="24" y="66" fill="#F7F4ED" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650">Updated Skill + preserved Intent</text>
      <circle cx="424" cy="47" r="15" fill="#12312F" stroke="#2DD4BF" stroke-width="2"/>
      <path d="M417 47l5 5 10-12" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
