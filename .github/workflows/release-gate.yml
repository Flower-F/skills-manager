name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Exact candidate deterministic checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run typecheck

  compatibility:
    name: skills@${{ matrix.skills }} clean-checkout smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skills: ['1.5.19', '^1.5.19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke:clean
        env:
          SKILLS_CLI_VERSION: ${{ matrix.skills }}

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
