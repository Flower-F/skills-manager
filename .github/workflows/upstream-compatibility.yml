name: Upstream 1.x compatibility

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-supported-1x:
    name: Latest supported skills 1.x clean-checkout smoke (release blocker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke:clean
        env:
          SKILLS_CLI_VERSION: ^1.5.19
