name: Feature or design proposal
description: Discuss a feature, domain-model change, or breaking behavior before implementation
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Major behavior changes require agreement here before a pull request. Ordinary questions use the support link in the issue chooser.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem needs solving?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe user-visible behavior, including effects on existing Intents.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Compatibility and migration
      description: Identify breaking 0.x behavior and proposed migration guidance, if any.
